# Baut den Fusion-X-Discord-Server auf (Kanäle, Rollen, Foren, Regeln, Webhook, Einladung).
# Braucht die Secrets DISCORD_BOT_TOKEN und DISCORD_GUILD_ID. Start: Actions → „Discord einrichten“ → Run workflow.
name: Discord einrichten

on:
  workflow_dispatch:
    inputs:
      ankuendigung:
        description: Ankündigung „Ein Discord für alle Projekte“ posten
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Server aufbauen
        run: node .github/discord/setup.mjs
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID || vars.DISCORD_GUILD_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANNOUNCE: ${{ inputs.ankuendigung && '1' || '0' }}
      - name: Bot-Profil
        run: node .github/discord/profile.mjs
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      - name: Einladungslink für die Website speichern
        run: |
          if [ -n "$(git status --porcelain docs/community.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/community.json
            git commit -m "Discord-Einladung für Website und App"
            git push
          fi
